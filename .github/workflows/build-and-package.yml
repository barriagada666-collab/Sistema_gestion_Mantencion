name: CI/CD - Compilación y Empaquetado (.NET 8 x64)

on:
  push:
    branches:
      - main
      - master
      - migracion-net8
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'Instalador/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    name: Resolver Versión desde VERSION.txt
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Descargar VERSION.txt
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            VERSION.txt
          sparse-checkout-cone-mode: false

      - name: Leer Versión Centralizada
        id: ver
        run: |
          APP_VER=$(tr -d '\r\n ' < VERSION.txt)
          if [ -z "$APP_VER" ]; then
            echo "::error::VERSION.txt está vacío"
            exit 1
          fi
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VER" >> "$GITHUB_OUTPUT"
          echo "Versión resuelta: $APP_VER (Tag: v$APP_VER)"

  build-and-package:
    name: Build, Publicación Autocontenida e Instalador
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: 1. Descargar Código Fuente (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Configurar Microsoft .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 3. Cachear Paquetes NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 4. Instalar Inno Setup 6
        run: |
          choco install innosetup --no-progress --no-color
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 5. Restaurar Dependencias NuGet
        run: |
          dotnet restore mantencion.sln

      - name: 6. Compilar Solución (Debug y Release)
        run: |
          dotnet build mantencion.sln -c Debug --no-restore --no-incremental --nologo
          dotnet build mantencion.sln -c Release --no-restore --no-incremental --nologo

      - name: 7. Publicar Aplicación Autocontenida (Self-Contained win-x64)
        run: |
          $publishDir = "mantencion\bin\Release\net8-selfcontained-x64"
          if (Test-Path $publishDir) {
              Remove-Item $publishDir -Recurse -Force
          }
          dotnet publish mantencion\mantencion.vbproj -c Release -r win-x64 --self-contained true -o $publishDir --nologo -v m

          # Depurar ensamblados WPF, símbolos de depuración e idiomas extranjeros conservando español ('es')
          python "automatizadores de instalacion\depurar_publicacion.py" $publishDir
          if ($LASTEXITCODE -ne 0) {
              Write-Error "depurar_publicacion.py falló con código $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          # Prueba rápida de arranque en Windows (valida deps.json y ausencia de ensamblados faltantes)
          $exePath = Join-Path $publishDir "Sistema de Gestion Mantencion.exe"
          $proc = Start-Process -FilePath $exePath -WorkingDirectory $publishDir -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
              Write-Error "El ejecutable Windows finalizó prematuramente con código $($proc.ExitCode)"
              exit 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✓ Arranque en Windows 64-bit verificado tras depuración."

      - name: 8. Compilar Instalador con Inno Setup
        run: |
          $appVer = "${{ needs.resolve-version.outputs.version }}"
          @"
          ; Sincronizado automáticamente desde VERSION.txt en CI
          #define MyAppVersion "$appVer"
          #define MyAppFileVersion "$appVer.0"
          #define MyAppTagVersion "v$appVer"
          "@ | Set-Content -Path "version.iss" -Encoding UTF8
          iscc Setup_Mantencion.iss

      - name: 9. Validar y Calcular Hash SHA256 del Instalador
        id: verify
        run: |
          $appVer = "${{ needs.resolve-version.outputs.version }}"
          $installer = "Instalador\Instalador_Sistema_Mantencion_v$appVer.exe"
          if (-not (Test-Path $installer)) {
              Write-Error "El instalador no fue generado en la ruta esperada: $installer"
              exit 1
          }
          $item = Get-Item $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          $sizeMb = [Math]::Round($item.Length / 1MB, 2)

          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "Instalador generado exitosamente:" -ForegroundColor Green
          Write-Host "Archivo : $($item.Name)" -ForegroundColor White
          Write-Host "Tamaño  : $sizeMb MB ($($item.Length) bytes)" -ForegroundColor White
          Write-Host "SHA256  : $hash" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Cyan

          # Guardar información en archivo de texto para los artefactos
          $info = @"
          Archivo: $($item.Name)
          Versión: $appVer
          Tamaño: $sizeMb MB ($($item.Length) bytes)
          Fecha Generación: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Plataforma: Microsoft .NET 8 LTS (Windows x64 - Autocontenido)
          Algoritmo: SHA-256
          Hash: $hash
          "@
          Set-Content -Path "Instalador\checksums_sha256.txt" -Value $info

      - name: 10. Empaquetar y Publicar en GitHub Packages (NuGet)
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet pack mantencion\mantencion.vbproj -c Release -o nupkg
          dotnet nuget push nupkg\*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: 11. Publicar Artefacto - Instalador Oficial y Paquete NuGet
        uses: actions/upload-artifact@v7
        with:
          name: Instalador-Sistema-Mantencion-v${{ needs.resolve-version.outputs.version }}
          path: |
            Instalador/Instalador_Sistema_Mantencion_v${{ needs.resolve-version.outputs.version }}.exe
            Instalador/checksums_sha256.txt
            nupkg/*.nupkg
          if-no-files-found: warn
          retention-days: 30

      - name: 12. Publicar en GitHub Releases (Oficial)
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Sistema de Gestión Mantención ${{ needs.resolve-version.outputs.tag }} LTS
          draft: false
          prerelease: false
          files: |
            Instalador/Instalador_Sistema_Mantencion_v${{ needs.resolve-version.outputs.version }}.exe
            Instalador/checksums_sha256.txt
            nupkg/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-installers-to-repo:
    name: Sincronizar Instaladores Oficiales en Carpeta /Instalador
    needs: [resolve-version, build-and-package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar Artefactos Windows y NuGet
        uses: actions/download-artifact@v8
        with:
          name: Instalador-Sistema-Mantencion-v${{ needs.resolve-version.outputs.version }}
          path: temp-win

      - name: Copiar Archivos a /Instalador
        run: |
          mkdir -p Instalador
          find Instalador -maxdepth 1 -type f ! -name 'README.md' -delete
          cp -fv temp-win/Instalador/* Instalador/ 2>/dev/null || cp -fv temp-win/* Instalador/ 2>/dev/null || true
          if [ -d "temp-win/nupkg" ]; then cp -fv temp-win/nupkg/*.nupkg Instalador/ 2>/dev/null || true; fi
          rm -rf temp-win
          ls -la Instalador/

      - name: Commit, Push a main y Actualizar Tag ${{ needs.resolve-version.outputs.tag }}
        run: |
          TAG_NAME="${{ needs.resolve-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Instalador/
          if git diff --staged --quiet; then
            echo "No hay cambios pendientes en Instalador/."
          else
            git commit -m "chore(release): actualizar instaladores $TAG_NAME en /Instalador [skip ci]"
            git push origin main
          fi
          git tag -f "$TAG_NAME" HEAD
          git push origin "$TAG_NAME" --force


