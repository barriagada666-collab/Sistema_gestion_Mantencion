name: CI/CD - Compilación y Empaquetado (.NET 8 x64)

on:
  push:
    branches:
      - main
      - master
      - migracion-net8
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'Instalador/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-package:
    name: Build, Publicación Autocontenida e Instalador
    runs-on: windows-latest

    steps:
      - name: 1. Descargar Código Fuente (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Configurar Microsoft .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 3. Cachear Paquetes NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 4. Instalar Inno Setup 6
        run: |
          choco install innosetup --no-progress --no-color
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 5. Restaurar Dependencias NuGet
        run: |
          dotnet restore mantencion.sln

      - name: 6. Compilar Solución (Release)
        run: |
          dotnet build mantencion.sln -c Release --no-restore

      - name: 7. Publicar Aplicación Autocontenida (Self-Contained win-x64)
        run: |
          $publishDir = "mantencion\bin\Release\net8-selfcontained-x64"
          if (Test-Path $publishDir) {
              Remove-Item $publishDir -Recurse -Force
          }
          dotnet publish mantencion\mantencion.vbproj -c Release -r win-x64 --self-contained true -o $publishDir --nologo -v m

          # Depurar ensamblados WPF, símbolos de depuración e idiomas extranjeros conservando español ('es')
          python "automatizadores de instalacion\depurar_publicacion.py" $publishDir
          if ($LASTEXITCODE -ne 0) {
              Write-Error "depurar_publicacion.py falló con código $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          # Prueba rápida de arranque en Windows (valida deps.json y ausencia de ensamblados faltantes)
          $exePath = Join-Path $publishDir "Sistema de Gestion Mantencion.exe"
          $proc = Start-Process -FilePath $exePath -WorkingDirectory $publishDir -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
              Write-Error "El ejecutable Windows finalizó prematuramente con código $($proc.ExitCode)"
              exit 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✓ Arranque en Windows 64-bit verificado tras depuración."

      - name: 8. Compilar Instalador con Inno Setup
        run: |
          iscc Setup_Mantencion.iss

      - name: 9. Validar y Calcular Hash SHA256 del Instalador
        id: verify
        run: |
          $installer = "Instalador\Instalador_Sistema_Mantencion_v2026.1.exe"
          if (-not (Test-Path $installer)) {
              Write-Error "El instalador no fue generado en la ruta esperada: $installer"
              exit 1
          }
          $item = Get-Item $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          $sizeMb = [Math]::Round($item.Length / 1MB, 2)

          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "Instalador generado exitosamente:" -ForegroundColor Green
          Write-Host "Archivo : $($item.Name)" -ForegroundColor White
          Write-Host "Tamaño  : $sizeMb MB ($($item.Length) bytes)" -ForegroundColor White
          Write-Host "SHA256  : $hash" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Cyan

          # Guardar información en archivo de texto para los artefactos
          $info = @"
          Archivo: $($item.Name)
          Tamaño: $sizeMb MB ($($item.Length) bytes)
          Fecha Generación: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Plataforma: Microsoft .NET 8 LTS (Windows x64 - Autocontenido)
          Algoritmo: SHA-256
          Hash: $hash
          "@
          Set-Content -Path "Instalador\checksums_sha256.txt" -Value $info

      - name: 10. Empaquetar y Publicar en GitHub Packages (NuGet)
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet pack mantencion\mantencion.vbproj -c Release -o nupkg
          dotnet nuget push nupkg\*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: 11. Publicar Artefacto - Instalador Oficial y Paquete NuGet
        uses: actions/upload-artifact@v7
        with:
          name: Instalador-Sistema-Mantencion-v2026.1
          path: |
            Instalador/Instalador_Sistema_Mantencion_v2026.1.exe
            Instalador/checksums_sha256.txt
            nupkg/*.nupkg
          if-no-files-found: warn
          retention-days: 30

      - name: 12. Publicar en GitHub Releases (Oficial)
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2026.1
          name: Sistema de Gestión Mantención v2026.1 LTS
          draft: false
          prerelease: false
          files: |
            Instalador/Instalador_Sistema_Mantencion_v2026.1.exe
            Instalador/checksums_sha256.txt
            nupkg/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}

  build-mac-installer:
    name: Build e Instalador macOS Universal (DMG)
    runs-on: macos-15-intel

    steps:
      - name: 1. Descargar Código Fuente (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Configurar Microsoft .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: 3. Cachear Motores Wine (MetalSharp ARM64 + Wine Staging x64)
        uses: actions/cache@v6
        with:
          path: ~/.cache/wine-downloads
          key: macos-wine-engines-v7.0-11.21

      - name: 4. Instalar llvm-strip si no está presente (para optimizar binarios PE ARM64 y x64)
        run: |
          if ! command -v llvm-strip &>/dev/null && [ ! -x /opt/homebrew/opt/llvm/bin/llvm-strip ] && [ ! -x /usr/local/opt/llvm/bin/llvm-strip ]; then
            brew install llvm
          fi

      - name: 5. Publicar Aplicación Autocontenida (win-arm64 y win-x64)
        run: |
          dotnet publish mantencion/mantencion.vbproj -c Release -r win-arm64 --self-contained true -o mantencion/bin/Release/net8-selfcontained-arm64 -p:EnableWindowsTargeting=true --nologo -v m
          dotnet publish mantencion/mantencion.vbproj -c Release -r win-x64 --self-contained true -o mantencion/bin/Release/net8-selfcontained-x64 -p:EnableWindowsTargeting=true --nologo -v m

      - name: 6. Generar macOS App Bundle Universal Nativo
        run: |
          chmod +x "automatizadores de instalacion/Generar_Instalador_Mac.sh"
          SKIP_ARCHIVE=1 WINE_CACHE_DIR="$HOME/.cache/wine-downloads" "./automatizadores de instalacion/Generar_Instalador_Mac.sh"

      - name: 7. Pruebas Exhaustivas de Paquete Universal (ARM64 + Intel x64) y Arranque Nativo
        run: |
          APP_BUNDLE="$(pwd)/dist-mac/Sistema de Gestion Mantencion.app"
          HOST_ARCH="$(uname -m)"
          echo "=== Arquitectura del Runner: $HOST_ARCH ==="

          # 1. Verificar Mach-O Universal (arm64 + x86_64) en Contents/MacOS/launcher
          LIPO_OUT=$(lipo -info "$APP_BUNDLE/Contents/MacOS/launcher")
          echo "Launcher lipo: $LIPO_OUT"
          echo "$LIPO_OUT" | grep -q "arm64"
          echo "$LIPO_OUT" | grep -q "x86_64"

          # 2. Verificar que wine-arm64 no contenga NINGÚN binario x86_64 y que ambos payloads existan
          X64_FOUND=$(find "$APP_BUNDLE/Contents/Resources/wine-arm64" -type f -exec file {} + | grep -i "x86_64" || true)
          if [ -n "$X64_FOUND" ]; then
            echo "[ERROR] Se detectaron binarios x86_64 dentro de wine-arm64:"
            echo "$X64_FOUND"
            exit 1
          fi
          test -f "$APP_BUNDLE/Contents/Resources/app-arm64/Sistema de Gestion Mantencion.exe"
          test -f "$APP_BUNDLE/Contents/Resources/app-x64/Sistema de Gestion Mantencion.exe"
          test -x "$APP_BUNDLE/Contents/Resources/wine-arm64/bin/wine-launcher"
          test -x "$APP_BUNDLE/Contents/Resources/wine-x64/bin/wine"
          echo "✓ Payloads Universal ARM64 + Intel x86_64 verificados (0 binarios x86_64 en wine-arm64)."

          # 3. Verificar firma local del App Bundle
          codesign --verify --strict "$APP_BUNDLE"
          echo "✓ codesign verificado."

          # 4. Prueba funcional real del launcher Universal en entorno Finder limpio (sin LANG/LC_ALL)
          if [ "$HOST_ARCH" = "arm64" ]; then
            WINE_ENGINE="$APP_BUNDLE/Contents/Resources/wine-arm64"
            PREFIX_SUBDIR="wineprefix-arm64"
          else
            WINE_ENGINE="$APP_BUNDLE/Contents/Resources/wine-x64"
            PREFIX_SUBDIR="wineprefix-x86_64"
          fi

          rm -rf "$HOME/Library/Application Support/SistemaMantencion/$PREFIX_SUBDIR" "$HOME/Library/Logs/SistemaMantencion"

          echo "Lanzando Contents/MacOS/launcher ($HOST_ARCH) simulando entorno limpio Finder/launchd..."
          env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" "$APP_BUNDLE/Contents/MacOS/launcher" >/tmp/ci-launcher-stdout.log 2>&1 &
          APP_PID=$!

          LOG_FILE="$HOME/Library/Logs/SistemaMantencion/launcher.log"
          for _ in $(seq 1 25); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            if grep -q "Lanzando Sistema de Gestion Mantencion.exe" "$LOG_FILE" 2>/dev/null; then
              sleep 6
              break
            fi
            sleep 1
          done

          echo "=== Contenido de launcher.log ==="
          cat "$LOG_FILE" || true
          cat /tmp/ci-launcher-stdout.log || true

          if grep -Eqi "Unhandled exception|FileNotFoundException|Could not load|Fatal error|ICU data|ApplicationException|starting debugger|winedbg" "$LOG_FILE" /tmp/ci-launcher-stdout.log 2>/dev/null; then
            echo "[ERROR] Se detectó una excepción de arranque en macOS ($HOST_ARCH)."
            kill "$APP_PID" 2>/dev/null || true
            "$WINE_ENGINE/bin/wineserver" -k 2>/dev/null || true
            exit 1
          fi

          if pgrep -f "winedbg" >/dev/null 2>&1; then
            echo "[ERROR] winedbg está activo: la aplicación crasheó en Wine ($HOST_ARCH)."
            "$WINE_ENGINE/bin/wineserver" -k 2>/dev/null || true
            exit 1
          fi

          RUNTIME_ERR=$(find "$HOME/Library/Application Support/SistemaMantencion/$PREFIX_SUBDIR" -name "error_runtime.log" 2>/dev/null | head -n 1)
          if [ -n "$RUNTIME_ERR" ] && [ -s "$RUNTIME_ERR" ]; then
            echo "[ERROR] ApplicationEvents.vb registró un error de ejecución en tiempo de arranque:"
            cat "$RUNTIME_ERR"
            "$WINE_ENGINE/bin/wineserver" -k 2>/dev/null || true
            exit 1
          fi

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ Proceso .NET 8 ($HOST_ARCH) en ejecución estable sin excepciones (PID $APP_PID)."
            kill "$APP_PID" 2>/dev/null || true
          else
            wait "$APP_PID" || APP_EXIT=$?
            echo "[ERROR] Launcher finalizó prematuramente con código: ${APP_EXIT:-0}"
            "$WINE_ENGINE/bin/wineserver" -k 2>/dev/null || true
            exit 1
          fi

          "$WINE_ENGINE/bin/wineserver" -k 2>/dev/null || true
          rm -rf "$HOME/Library/Application Support/SistemaMantencion" "$HOME/Library/Logs/SistemaMantencion" /tmp/ci-launcher-stdout.log

      - name: 8. Comprimir DMG (ULMO LZMA) y ZIP (-9) + Checksums SHA256
        run: |
          mkdir -p Instalador
          DMG_NAME="Instalador_Sistema_Mantencion_v2026.1_macOS.dmg"
          ZIP_NAME="Instalador_Sistema_Mantencion_v2026.1_macOS_Universal.zip"

          (
            cd dist-mac
            zip -9 -r -y "../Instalador/$ZIP_NAME" "Sistema de Gestion Mantencion.app" "Instalar_en_Mac.command" "Iniciar_con_Whisky.command" "LEAME_MAC.html"
          )

          hdiutil create -volname "Sistema Mantencion" -srcfolder "dist-mac" -ov -format ULMO "Instalador/$DMG_NAME"

          cd Instalador
          shasum -a 256 "$DMG_NAME" > checksums_mac_sha256.txt
          shasum -a 256 "$ZIP_NAME" >> checksums_mac_sha256.txt
          cat checksums_mac_sha256.txt
          ls -lh "$DMG_NAME" "$ZIP_NAME"


      - name: 9. Publicar Artefacto - Instalador macOS (DMG y ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: Instalador-Sistema-Mantencion-v2026.1-macOS
          path: |
            Instalador/Instalador_Sistema_Mantencion_v2026.1_macOS.dmg
            Instalador/Instalador_Sistema_Mantencion_v2026.1_macOS_Universal.zip
            Instalador/checksums_mac_sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: 10. Publicar en GitHub Releases (macOS Assets)
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2026.1
          name: Sistema de Gestión Mantención v2026.1 LTS
          draft: false
          prerelease: false
          files: |
            Instalador/Instalador_Sistema_Mantencion_v2026.1_macOS.dmg
            Instalador/Instalador_Sistema_Mantencion_v2026.1_macOS_Universal.zip
            Instalador/checksums_mac_sha256.txt
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-installers-to-repo:
    name: Sincronizar Instaladores Oficiales en Carpeta /Instalador
    needs: [build-and-package, build-mac-installer]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Descargar Artefactos Windows y NuGet
        uses: actions/download-artifact@v8
        with:
          name: Instalador-Sistema-Mantencion-v2026.1
          path: temp-win

      - name: Descargar Artefactos macOS
        uses: actions/download-artifact@v8
        with:
          name: Instalador-Sistema-Mantencion-v2026.1-macOS
          path: temp-mac

      - name: Copiar Archivos a /Instalador
        run: |
          mkdir -p Instalador
          cp -fv temp-win/Instalador/* Instalador/ 2>/dev/null || cp -fv temp-win/* Instalador/ 2>/dev/null || true
          cp -fv temp-mac/Instalador/* Instalador/ 2>/dev/null || cp -fv temp-mac/* Instalador/ 2>/dev/null || true
          if [ -d "temp-win/nupkg" ]; then cp -fv temp-win/nupkg/*.nupkg Instalador/ 2>/dev/null || true; fi
          rm -rf temp-win temp-mac
          ls -la Instalador/

      - name: Commit, Push a main y Actualizar Tag v2026.1 (Source code)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add .gitattributes Instalador/
          if git diff --staged --quiet; then
            echo "No hay cambios pendientes en Instalador/."
          else
            git commit -m "chore(release): actualizar instaladores en /Instalador [skip ci]"
            git push origin main
          fi
          git tag -f v2026.1 HEAD
          git push origin v2026.1 --force


